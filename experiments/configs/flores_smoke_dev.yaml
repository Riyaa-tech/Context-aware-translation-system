# FLORES-200 smoke test (one direction, FLORES *dev* split, first 100 sentences).
# PILOT SUBSET: not the full benchmark and not devtest. Checks that loading, language codes,
# decoding and BLEU/spBLEU/chrF++ scoring work end to end, and whether the modules change general text.
name: flores_smoke_dev
description: FLORES-200 dev, eng_Latn-hin_Deva, first 100 sentences, conditions A and D_paraphrase (pilot subset).
split: dev
seed: 20261101
batch_size: 8
limit: 100
datasets:
  - experiments/datasets/flores/flores_dev_eng_Latn-hin_Deva.jsonl
conditions: [A, D_paraphrase]
